<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퀴즈 게임</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="app">

    <div class="app-toolbar">
      <button id="theme-toggle-btn" class="btn-icon" type="button" aria-label="다크모드 전환">🌙</button>
    </div>

    <section id="start-screen" class="screen active">
      <h1>🧠 상식 퀴즈</h1>
      <p>한국사 · 과학 · 지리 · 스포츠, 원하는 방식으로 도전하세요!</p>

      <div id="mode-select" class="mode-select">
        <button class="btn-mode" data-mode="full">🏆 전체 도전 (80문제)</button>
        <button class="btn-mode" data-mode="category">📚 카테고리별 도전 (10문제)</button>
        <button class="btn-mode" data-mode="speed">⚡ 스피드 퀴즈 (20문제, 문제당 15초)</button>
      </div>

      <div id="difficulty-select" class="difficulty-select">
        <p class="difficulty-label">난이도</p>
        <div class="difficulty-buttons" role="group" aria-label="난이도 선택">
          <button class="btn-difficulty active" data-difficulty="all" type="button">전체</button>
          <button class="btn-difficulty" data-difficulty="easy" type="button">쉬움</button>
          <button class="btn-difficulty" data-difficulty="medium" type="button">보통</button>
          <button class="btn-difficulty" data-difficulty="hard" type="button">어려움</button>
        </div>
      </div>

      <button id="dashboard-btn" class="btn-secondary btn-block" type="button">📊 내 기록 보기</button>

      <div id="category-select" class="category-select hidden">
        <p>카테고리를 선택하세요</p>
        <div class="category-buttons">
          <button class="btn-category" data-category="한국사">한국사</button>
          <button class="btn-category" data-category="과학">과학</button>
          <button class="btn-category" data-category="지리">지리</button>
          <button class="btn-category" data-category="스포츠">스포츠</button>
        </div>
        <button id="category-back-btn" class="btn-secondary">뒤로</button>
      </div>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="quiz-info">
          <span id="question-counter"></span>
          <span id="category-badge" class="badge"></span>
          <span id="streak-display"></span>
          <span id="score-display"></span>
        </div>
        <div id="timer-display" class="timer-display hidden">⏱ <span id="timer-seconds">0</span>초</div>
      </div>

      <div class="question-box">
        <h2 id="question-text"></h2>
      </div>

      <div class="quiz-actions">
        <button id="hint-btn" class="btn-secondary" type="button">💡 힌트 (<span id="hint-count">3</span>)</button>
        <button id="pause-btn" class="btn-secondary" type="button">⏸ 일시정지</button>
      </div>


      <div id="options-container" class="options-container" role="group" aria-label="보기"></div>

      <div id="feedback" class="feedback hidden" role="status" aria-live="polite">
        <p id="feedback-text" class="feedback-text"></p>
        <p id="feedback-explanation" class="feedback-explanation"></p>
        <button id="next-btn" class="btn-primary">다음 문제</button>
      </div>

      <div id="pause-overlay" class="pause-overlay hidden">
        <div class="pause-box">
          <h2>⏸ 일시정지</h2>
          <button id="resume-btn" class="btn-primary">계속하기</button>
        </div>
      </div>
    </section>

    <section id="result-screen" class="screen">
      <h1>게임 종료!</h1>
      <p id="result-new-best" class="new-best hidden">🎉 개인 최고 기록 갱신!</p>
      <div class="result-summary">
        <p class="result-row"><span>총점</span><strong id="result-score"></strong></p>
        <p class="result-row"><span>정답 개수</span><strong id="result-correct"></strong></p>
        <p class="result-row"><span>정답률</span><strong id="result-accuracy"></strong></p>
        <p class="result-row"><span>평균 응답 시간</span><strong id="result-avg-time"></strong></p>
        <p class="result-row"><span>최다 연속 정답</span><strong id="result-streak"></strong></p>
      </div>
      <div id="result-category-stats" class="category-stats"></div>
      <div class="result-actions">
        <button id="share-btn" class="btn-secondary btn-block" type="button">📋 결과 공유</button>
        <button id="restart-btn" class="btn-primary">다시 시작</button>
      </div>
    </section>

    <section id="dashboard-screen" class="screen">
      <h1>📊 내 기록</h1>

      <div class="dashboard-summary">
        <div class="stat-card">
          <span class="stat-value" id="stat-play-count">0</span>
          <span class="stat-label">플레이 횟수</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-best-score">0</span>
          <span class="stat-label">최고 점수</span>
        </div>
      </div>

      <h2 class="dashboard-subtitle">카테고리별 정답률</h2>
      <div id="dashboard-category-stats" class="dashboard-category-stats"></div>

      <h2 class="dashboard-subtitle">최근 점수 추이</h2>
      <div id="dashboard-trend" class="dashboard-trend"></div>

      <h2 class="dashboard-subtitle">리더보드</h2>
      <div class="leaderboard-tabs" role="tablist" aria-label="리더보드 기간">
        <button class="btn-tab active" data-range="daily" type="button">일간</button>
        <button class="btn-tab" data-range="weekly" type="button">주간</button>
        <button class="btn-tab" data-range="allTime" type="button">전체</button>
      </div>
      <ol id="dashboard-leaderboard" class="leaderboard-list"></ol>

      <button id="dashboard-back-btn" class="btn-primary">뒤로</button>
    </section>

  </div>

  <script src="js/questions.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
</body>

</html>
